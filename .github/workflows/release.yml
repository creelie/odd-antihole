name: release

# Run by hand from the Actions tab after the pull request is merged. It builds the Lean proof
# and checks its axioms, runs the complete C check at l = 4 and the C++ and Python checks, then
# publishes a GitHub release with the paper files in dist/ and the notes in
# .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0.0"
        required: true
        default: "v2.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "Every odd antihole is strongly chromatic-choosable"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean proof and axioms, complete C check at l = 4, C++ and Python checks
        run: FULL_C=1 ./run_all.sh

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/OddAntihole_final2.pdf \
                   dist/OddAntihole_final2-tex.zip \
                   dist/OddAntihole_final2-arxiv.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/OddAntihole_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
